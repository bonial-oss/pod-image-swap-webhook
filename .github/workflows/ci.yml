---
name: ci
on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: [1.26.9]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          # Release builds start from a clean cache to avoid cache poisoning
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Download go modules
        run: go mod download

      - name: Run go test
        run: make coverage

      - name: Run go vet
        run: make vet
